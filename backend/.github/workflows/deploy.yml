name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check for syntax errors
        working-directory: backend
        run: node --check src/server.js


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="

            APP_DIR="/var/www/backend"
            TEMP_DIR="/tmp/backend-deploy"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Cleaning previous temporary deployment..."
            rm -rf "$TEMP_DIR"

            echo "Cloning latest repository..."
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$TEMP_DIR"

            echo "Updating backend files..."

            mkdir -p "$APP_DIR"
            mkdir -p "$APP_DIR/logs"

            rsync -a --delete \
              --exclude='.env' \
              --exclude='ecosystem.config.js' \
              --exclude='logs/' \
              "$TEMP_DIR/backend/" "$APP_DIR/"

            echo "Installing dependencies..."
            cd "$APP_DIR"
            npm ci --omit=dev

            echo "Restarting application with PM2..."

            if pm2 describe backend-api > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi

            pm2 save

            echo "Waiting for application to start..."
            sleep 5

            echo "Health check..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:5000/api/health || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "SUCCESS: Health check passed (HTTP $HTTP_STATUS)"
            else
              echo "ERROR: Health check failed (HTTP $HTTP_STATUS)"
              pm2 status
              pm2 logs backend-api --lines 20 --nostream
              exit 1
            fi

            rm -rf "$TEMP_DIR"

            echo "========================================="
            echo "DEPLOYMENT FINISHED"
            echo "Time: $(date)"
            echo "========================================="